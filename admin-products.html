<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product CMS | Best2Buy</title><link rel="stylesheet" href="admin-products.css"></head><body><main class="admin-shell"><header><a href="index.html"><img src="Logo%201.png" alt="Best2Buy"></a><a href="index.html">← Website</a></header><section id="auth-panel" class="panel auth-panel"><p class="kicker">BEST2BUY CMS</p><h1>Manage your products.</h1><p>Sign in to add products that appear on the homepage instantly.</p><form id="auth-form"><label>Email<input id="auth-email" type="email" required></label><label>Password<input id="auth-password" type="password" required minlength="6"></label><div><button class="primary" id="sign-in" type="submit">Sign in</button><button class="secondary" id="sign-up" type="button">Create account</button></div><p id="auth-status" role="status"></p></form></section><section id="cms-panel" hidden><div class="cms-top"><div><p class="kicker">PRODUCT CMS</p><h1>Your catalogue</h1></div><button id="sign-out" class="secondary">Sign out</button></div><div class="manager-grid"><form id="product-form" class="panel"><h2 id="form-title">Add product</h2><input type="hidden" id="product-id"><label>Product name<input id="product-title" required placeholder="Flexible Fridge Magnet 1 mm"></label><label>Custom page link (optional)<input id="product-url" placeholder="Leave blank to use the automatic product page"></label><label>Category<input id="product-category" placeholder="Personalised products"></label><label>Price / offer label<input id="product-price" placeholder="From ₹34 / piece"></label><label>Product description<textarea id="product-description" rows="3"></textarea></label><label>Product image<input id="product-image" type="file" accept="image/*"></label><label class="check"><input id="product-published" type="checkbox" checked> Show this product on the website</label><button class="primary" type="submit">Save product</button><button class="secondary" id="cancel-edit" type="button" hidden>Cancel edit</button><p id="form-status"></p></form><div class="panel"><div class="list-head"><h2>Published products</h2><button id="refresh" class="secondary">Refresh</button></div><div id="product-list"></div></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin-products.js"></script></body></html>
